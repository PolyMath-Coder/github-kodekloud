name: The very first workflow
on: push
jobs:
  first_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout my code
        uses: actions/checkout@v6

      - name: List files and also read README.md
        run: |
          echo "Hello world!"  
          ls -la
          cat README.md
      - name: Generate A beautiful artwork
        run: cowsay -f dragon 'Run for cover! I am a dragon!' >> dragon.txt

